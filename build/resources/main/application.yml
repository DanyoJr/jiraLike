spring:
  application:
    name: jiralike

  datasource:
    url: jdbc:h2:file:./data/jiralike;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "3cfa76ef14937c1c0ea519f8fc057a80fcd04a7958de97bc7e6a1e0e3a4c1a2b"
    expiration-ms: 86400000  # 24 hours

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: 5000

logging:
  level:
    com.jiralike: DEBUG
    org.springframework.security: INFO
